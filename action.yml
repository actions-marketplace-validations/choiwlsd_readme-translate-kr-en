name: readme-translate-kr-en

description: Free, local-first English/Korean README translation with no API key.

author: readme-translate-kr-en

inputs:
  from:
    description: Source language (en or ko). Leave empty to auto-detect from the latest commit.
    required: false
    default: ""

  python-version:
    description: Python version used by the local translation engine.
    required: false
    default: "3.11"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache Hugging Face models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: readme-translate-kr-en-huggingface-${{ runner.os }}-${{ inputs.python-version }}
        restore-keys: |
          readme-translate-kr-en-huggingface-${{ runner.os }}-

    - name: Install translation dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r "$GITHUB_ACTION_PATH/requirements.txt"

    - name: Install Node.js dependencies
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"

        if [ -f package-lock.json ]; then
          npm ci --omit=dev
        elif [ -f package.json ]; then
          npm install --omit=dev
        fi

    - name: Sync README translation
      shell: bash
      env:
        INPUT_FROM: ${{ inputs.from }}
      run: |
        if [ -n "$INPUT_FROM" ]; then
          node "$GITHUB_ACTION_PATH/src/cli.js" sync --from "$INPUT_FROM"
        else
          node "$GITHUB_ACTION_PATH/src/cli.js" sync
        fi
