name: readme-translate-kr-en

description: Free, local-first English/Korean README translation with no API key.

author: readme-translate-kr-en

inputs:
  from:
    description: Source language (en or ko). Leave empty to auto-detect from the latest commit.
    required: false
    default: ""

  source-file:
    description: Source README file.
    required: false
    default: "README.md"

  target-file:
    description: Target translated README file. Leave empty to auto-generate based on source language.
    required: false
    default: ""

  python-version:
    description: Python version used by the local translation engine.
    required: false
    default: "3.11"

runs:
  using: composite

  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache Hugging Face models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: readme-translate-kr-en-huggingface-${{ runner.os }}-${{ inputs.python-version }}
        restore-keys: |
          readme-translate-kr-en-huggingface-${{ runner.os }}-

    - name: Install translation dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r "$GITHUB_ACTION_PATH/requirements.txt"

    - name: Install Node.js dependencies
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"

        if [ -f package-lock.json ]; then
          npm ci --omit=dev
        elif [ -f package.json ]; then
          npm install --omit=dev
        fi

    - name: Sync README translation
      shell: bash
      env:
        INPUT_FROM: ${{ inputs.from }}
        SOURCE_FILE: ${{ inputs.source-file }}
        TARGET_FILE: ${{ inputs.target-file }}
      run: |
        args=(sync --source "$SOURCE_FILE")

        if [ -n "$INPUT_FROM" ]; then
          args+=(--from "$INPUT_FROM")
        fi

        if [ -n "$TARGET_FILE" ]; then
          args+=(--target "$TARGET_FILE")
        fi

        node "$GITHUB_ACTION_PATH/src/cli.js" "${args[@]}"
