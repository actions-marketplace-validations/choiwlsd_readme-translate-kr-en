name: readme-translate-kr-en

description: Translate, commit, and safely sync English/Korean READMEs with no API key.

author: readme-translate-kr-en

branding:
  icon: book-open
  color: blue

inputs:
  from:
    description: Source language (en or ko). Leave empty to infer it from a single changed standard README in the latest commit.
    required: false
    default: ""

  source-file:
    description: Source README file. Leave this and from empty to auto-detect a single changed standard README; otherwise defaults to README.md.
    required: false
    default: ""

  target-file:
    description: Target translated README file. Leave empty to auto-generate based on source language.
    required: false
    default: ""

  python-version:
    description: Python version used by the local translation engine.
    required: false
    default: "3.11"

  push-changes:
    description: Commit and push translated README files safely.
    required: false
    default: "true"

  commit-message:
    description: Commit message used when push-changes is enabled.
    required: false
    default: "docs: sync bilingual README"

outputs:
  source-file:
    description: Source README processed by the Action.
    value: ${{ steps.translate.outputs.source-file }}
  target-file:
    description: Translated README written by the Action.
    value: ${{ steps.translate.outputs.target-file }}

runs:
  using: composite

  steps:
    - name: Record translation base
      id: git-base
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "24"

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache Hugging Face models
      uses: actions/cache@v6
      with:
        path: ~/.cache/huggingface
        key: readme-translate-kr-en-huggingface-${{ runner.os }}-${{ inputs.python-version }}
        restore-keys: |
          readme-translate-kr-en-huggingface-${{ runner.os }}-

    - name: Install translation dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r "$GITHUB_ACTION_PATH/requirements.txt"

    - name: Sync README translation
      id: translate
      shell: bash
      env:
        INPUT_FROM: ${{ inputs.from }}
        SOURCE_FILE: ${{ inputs.source-file }}
        TARGET_FILE: ${{ inputs.target-file }}
      run: |
        args=(sync)

        if [ -n "$INPUT_FROM" ]; then
          args+=(--from "$INPUT_FROM")
        fi

        if [ -n "$SOURCE_FILE" ]; then
          args+=(--source "$SOURCE_FILE")
        fi

        if [ -n "$TARGET_FILE" ]; then
          args+=(--target "$TARGET_FILE")
        fi

        node "$GITHUB_ACTION_PATH/src/cli.js" "${args[@]}"

    - name: Commit and push translation
      if: inputs.push-changes == 'true'
      shell: bash
      env:
        BASE_SHA: ${{ steps.git-base.outputs.sha }}
        SOURCE_PATH: ${{ steps.translate.outputs.source-file }}
        TARGET_PATH: ${{ steps.translate.outputs.target-file }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        if [[ "${GITHUB_REF}" != refs/heads/* ]]; then
          echo "Automatic push requires a branch ref; current ref is ${GITHUB_REF}." >&2
          exit 1
        fi

        node "$GITHUB_ACTION_PATH/src/git-sync.js" \
          --base-sha "$BASE_SHA" \
          --branch "$GITHUB_REF_NAME" \
          --commit-message "$COMMIT_MESSAGE" \
          --file "$SOURCE_PATH" \
          --file "$TARGET_PATH"
