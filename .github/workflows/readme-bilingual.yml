name: Sync bilingual README

on:
  push:
    branches: [main]
    paths:
      - README.md
      - README.ko.md
  workflow_dispatch:
    inputs:
      from:
        description: Source language
        required: false
        default: en
        type: choice
        options: [en, ko]

permissions:
  contents: write

concurrency:
  group: readme-translation-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Translate README locally
        uses: ./
        with:
          from: ${{ github.event.inputs.from }}
          source-file: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.from == 'ko' && 'README.ko.md' || 'README.md') || '' }}
