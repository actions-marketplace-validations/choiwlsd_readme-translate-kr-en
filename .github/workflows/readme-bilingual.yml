name: Sync bilingual README

on:
  push:
    branches: [main]
    paths:
      - README.md
      - README.ko.md
  workflow_dispatch:
    inputs:
      from:
        description: Source language
        required: false
        default: en
        type: choice
        options: [en, ko]

permissions:
  contents: write

concurrency:
  group: readme-translation-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Translate README locally
        uses: ./
        with:
          from: ${{ github.event.inputs.from }}
          source-file: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.from == 'ko' && 'README.ko.md' || 'README.md') || '' }}

      - name: Commit translation
        shell: bash
        run: |
          if git diff --quiet -- README.md README.ko.md; then
            echo "No README changes."
            exit 0
          fi

          base_sha="$(git rev-parse HEAD)"
          branch="${GITHUB_REF_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.ko.md
          git commit -m "docs: sync bilingual README"

          git fetch origin "$branch"
          remote_sha="$(git rev-parse "origin/$branch")"

          if [ "$remote_sha" != "$base_sha" ]; then
            if ! git diff --quiet "$base_sha" "$remote_sha" -- README.md README.ko.md; then
              echo "README changed while translation was running."
              echo "Skipping this stale result; the newer workflow run will translate it."
              exit 0
            fi

            git rebase "origin/$branch"
          fi

          git push origin "HEAD:$branch"
